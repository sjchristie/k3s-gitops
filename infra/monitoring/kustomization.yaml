apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ns.yaml
  - httproutes.yaml

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 92.22.0
    releaseName: monitoring
    namespace: monitoring
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
