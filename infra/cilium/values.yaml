# API server address. kube-proxy is off, so Cilium needs this.
k8sServiceHost: 192.168.30.20
k8sServicePort: 6443

# Replace kube-proxy
kubeProxyReplacement: true

# K3s runs cgroup v2 at /sys/fs/cgroup
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Use the pod range K3s gave the node
ipam:
  mode: kubernetes

# One node: one operator replica
operator:
  replicas: 1

# L2 announcements make many API calls, so raise the limit
k8sClientRateLimit:
  qps: 100
  burst: 200

# LoadBalancer addresses on the LAN
l2announcements:
  enabled: true

# Gateway API
gatewayAPI:
  enabled: true
