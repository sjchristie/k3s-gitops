apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      containers:
        - name: searxng
          image: ghcr.io/searxng/searxng:2026.11.21-c6ee3e9fd
          ports:
            - containerPort: 8080
          env:
            - name: SEARXNG_BASE_URL
              value: https://searxng.christiehome.work/
            - name: SEARXNG_LIMITER
              value: "false"
            - name: SEARXNG_IMAGE_PROXY
              value: "true"
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: searxng-secret
                  key: secret-key
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
